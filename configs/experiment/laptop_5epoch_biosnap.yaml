seed_everything: 42
trainer:
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  deterministic: true
  max_epochs: 5
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  enable_model_summary: false
  logger:
    class_path: graphddi.training.MLFlowLogger
    init_args:
      experiment_name: graphddi-biosnap-laptop-5ep
      log_model: false
  callbacks:
  - class_path: graphddi.training.GraphDDIParamSummary
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: step
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val/f1
      mode: max
      save_top_k: 1
      save_last: true
  - class_path: graphddi.training.GraphDDIProgressBar
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val/f1
      mode: max
      patience: 8
      min_delta: 0.001

data:
  class_path: graphddi.data.BioSNAPDataModule
  init_args:
    data_root: ./data
    batch_size: 128
    num_workers: 2
model:
  class_path: graphddi.models.GraphDDIModule
  init_args:
    encoder:
      class_path: graphddi.models.PNAEncoder
      init_args:
        in_channels: 108
        hidden_channels: 64
        edge_dim: 9
        edge_hidden_channels: 128
        num_layers: 6
        dropout: 0.1
    readout:
      class_path: graphddi.models.Set2SetReadout
      init_args:
        in_channels: 128
        processing_steps: 2
        project_to: 128
    use_interaction_map: true
    hidden_dim: 64
    mlp_hidden_dim: 128
    dropout: 0.1
    label_smoothing: 0.0
    lr: 0.0003
    weight_decay: 0.01
    warmup_steps: 300
    max_steps: 2300
