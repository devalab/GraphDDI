seed_everything: 42
matmul_precision: medium
trainer:
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  deterministic: true
  gradient_clip_val: 1.0
  log_every_n_steps: 25
  enable_model_summary: false   # Lightning's ModelSummary hard-codes FlopCounterMode (noisy on Windows/CUDA without triton); GraphDDIParamSummary below replaces it
  logger:
    class_path: graphddi.training.MLFlowLogger
    init_args:
      experiment_name: graphddi
      log_model: false
  callbacks:
    - class_path: graphddi.training.GraphDDIParamSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/f1_macro
        mode: max
        save_top_k: 3
        save_last: true
        every_n_epochs: 1
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/f1_macro
        mode: max
        patience: 10
        min_delta: 0.001
    - class_path: graphddi.training.GraphDDIProgressBar
